name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build ScopeHTTP
        run: cmake --build build --config Release --parallel

      - name: Install release files
        run: cmake --install build --config Release --prefix dist

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ScopeHTTP-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          ScopeHTTP-Windows-x64.zip
          --title "ScopeHTTP $env:GITHUB_REF_NAME"
          --generate-notes

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScopeHTTP-Windows-x64
          path: ScopeHTTP-Windows-x64.zip
